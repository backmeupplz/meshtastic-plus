# On a published GitHub release: build the Play flavor with the upload key, attach meshplus.apk
# (meshplus.app downloads releases/latest/download/meshplus.apk), and send the bundle to Play.
# F-Droid needs nothing here: it builds the fdroid flavor from each new v* tag itself.
name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          PROPERTIES: ${{ secrets.UPLOAD_PROPERTIES }} # storePassword, keyAlias, keyPassword lines
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 -d > ~/.android/meshplus-upload.jks
          { echo "storeFile=$HOME/.android/meshplus-upload.jks"; echo "$PROPERTIES"; } > ~/.android/meshplus-upload.properties
      - run: ./gradlew assemblePlayRelease bundlePlayRelease
      - name: Attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/play/release/app-play-release.apk meshplus.apk
          gh release upload "${{ github.event.release.tag_name }}" meshplus.apk --clobber
      - name: Upload to Play
        if: ${{ env.PLAY_JSON != '' }} # skipped until the service-account secret exists
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.borodutch.meshplus
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          track: production
